<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area of Circle</title>
</head>

<body>

    <h2>Area of Circle</h2>
    <div id="root"></div>

    <script>
        let r = Number(prompt("Enter radius:"));

        let area = 3.14 * r * r;

        document.getElementById("root").innerHTML =
            "Area of Circle = " + area;
    </script>

</body>

</html>
