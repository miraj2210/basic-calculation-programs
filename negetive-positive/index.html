<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positive Negative Zero</title>
</head>

<body>

    <h3>Positive, Negative </h3>
    <div id="root"></div>

    <script>
        let num = Number(prompt("Enter a number:"));

        if (num > 0) {
            document.getElementById("root").innerHTML = "Positive";
        }
        else if (num < 0) {
            document.getElementById("root").innerHTML = "Negative";
        }
        else {
            document.getElementById("root").innerHTML = "Zero";
        }
    </script>

</body>

</html>
