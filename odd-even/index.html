<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even-Odd Number</title>
</head>

<body>

    <h3>Even Odd Checker</h3>
    <div id="root"></div>

    <script>
        let num = Number(prompt("Enter a number:"));

        if (num % 2 === 0) {
            document.getElementById("root").innerHTML =
                "The number is Even";
        } else {
            document.getElementById("root").innerHTML =
                "The number is Odd";
        }
    </script>

</body>

</html>
